name: CI

# Pushes to main are built (and deployed as snapshots) by snapshot-publish.yaml; running this too
# would just repeat the same build. PRs are validated here.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build (version stamped with git SHA so artifacts are traceable)
        run: mvn -B "-Drevision=0.1.0-SNAPSHOT-$(git rev-parse --short HEAD)" install